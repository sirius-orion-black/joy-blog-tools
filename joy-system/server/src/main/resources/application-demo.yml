server:
  port: 8081
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dbname?characterEncoding=UTF-8&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&tinyInt1isBit=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: name
    password: pwd
    hikari:
      max-lifetime: 1200000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 5
  data:                                    # ✅ 修改：spring.redis → spring.data.redis
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 5000
      database: 6
      password: pwd
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms                # ✅ 建议修改：-1ms → 10000ms
        shutdown-timeout: 100ms
      keep-alive: true

  mail:
    host: 你的邮箱SMTP服务器地址
    port: 你的端口号
    username: 你的邮箱账号
    password: 你的邮箱授权码
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

